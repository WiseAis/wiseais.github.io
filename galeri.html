<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIS — Astrofotoğraflar</title>
<meta name="description" content="AIS astrofotoğraf koleksiyonu.">
<meta name="theme-color" content="#0d1725">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23182943'/%3E%3Cpath d='M6 23 16 6l10 17M10 18h12' fill='none' stroke='%23ece8de' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='23' r='2' fill='%2359a6b5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/gallery.css?v=mobile-title-1">
</head>
<body class="gallery-body">
<header class="top gallery-top">
  <a class="mark gallery-mark" href="./" aria-label="AIS proje arşivine dön">AIS<small>ARŞİV / 00.4</small></a>
  <nav class="nav gallery-nav" aria-label="Ana menü">
    <a href="./#projects">projeler</a>
    <a href="galeri.html" aria-current="page">astrofotoğraflar</a>
    <a href="./#archive">indeks</a>
    <a href="./#top">hakkında</a>
  </nav>
</header>

<main class="gallery-page">
  <section class="gallery-hero" aria-labelledby="gallery-title">
    <div class="gallery-hero-copy">
      <div class="gallery-eyebrow">ASTROFOTOĞRAF</div>
      <h1 id="gallery-title">GÖĞÜN<br><span>İZLERİ.</span></h1>
      <a class="gallery-enter" href="#observations"><span>kayıtlara bak</span><span aria-hidden="true">↓</span></a>
    </div>
    <figure class="gallery-artwork">
      <div class="gallery-artwork__frame" id="gallery-art-display">
        <img class="gallery-artwork__image" data-art-variant="bayer" data-src="assets/gallery/hero-bayer.webp" alt="Fotonların Bayer renk filtresindeki kırmızı, yeşil ve mavi sensör hücrelerine düşmesini gösteren kavramsal görsel." hidden>
        <img class="gallery-artwork__image" data-art-variant="exposure" data-src="assets/gallery/hero-exposure.webp" alt="Yıldızlar ve zayıf gökyüzü ışığının kumlu karanlık içinden belirginleşmesini gösteren kavramsal görsel." hidden>
      </div>
      <figcaption class="gallery-art-controls">
        <div role="group" aria-label="Karşılama görseli seçimi">
          <button type="button" data-art-choice="bayer" aria-controls="gallery-art-display" aria-pressed="true">Bayer CFA</button>
          <button type="button" data-art-choice="exposure" aria-controls="gallery-art-display" aria-pressed="false">Sinyal</button>
        </div>
      </figcaption>
    </figure>
  </section>

  <section class="gallery-collection" id="observations" aria-labelledby="collection-title">
    <div class="collection-heading">
      <div>
        <h2 id="collection-title">ASTRO<wbr>FOTOĞRAFLAR</h2>
      </div>
    </div>

    <div class="gallery-grid" id="gallery-grid" aria-live="polite" aria-busy="true">
      <p class="gallery-status">Görsel kayıtları yükleniyor…</p>
    </div>
    <noscript><p class="gallery-status">Galeriyi görüntülemek için JavaScript açık olmalı.</p></noscript>
  </section>

  <footer class="gallery-footer">
    <a href="./#projects">← proje arşivine dön</a>
    <span>AIS / GÖRSEL ARŞİV</span>
  </footer>
</main>

<dialog class="gallery-viewer" id="gallery-viewer" aria-labelledby="viewer-title" aria-describedby="viewer-description">
  <div class="gallery-viewer__top">
    <div>
      <div class="gallery-viewer__eyebrow">AIS / TAM ÇÖZÜNÜRLÜK JPEG</div>
      <h2 id="viewer-title">Görsel açılıyor</h2>
      <p id="viewer-description"></p>
    </div>
    <button class="gallery-viewer__close" type="button" data-viewer-close aria-label="Görseli kapat" autofocus>×</button>
  </div>
  <div class="gallery-viewer__stage" aria-busy="true">
    <p class="gallery-viewer__status" id="viewer-status" role="status" aria-live="polite">Tam çözünürlüklü görsel yükleniyor…</p>
    <img class="gallery-viewer__image" id="viewer-image" alt="" hidden>
  </div>
  <dl class="gallery-viewer__metadata" id="viewer-metadata"></dl>
</dialog>

<script src="assets/js/gallery.js" defer></script>
</body>
</html>
